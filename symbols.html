<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الرموز النادرة والشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .symbol-btn { transition: all 0.1s ease; }
        .symbol-btn:active { transform: scale(0.85); background-color: #4338ca; }
    </style>
</head>
<body class="pb-16">

    <!-- شريط تجميع النصوص العلوي -->
    <div class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 p-3 shadow-xl">
        <div class="max-w-4xl mx-auto flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-indigo-400"><i class="fa-solid fa-pen-ruler"></i> شريط التجميع:</span>
                <span id="char-count" class="text-[11px] text-gray-400">0 حرف</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="builder-input" placeholder="اضغط على الرموز لتجميعها..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-emerald-400 text-lg font-bold outline-none focus:border-indigo-500">
                <button onclick="copyBuilderText()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-1 shrink-0">
                    <i class="fa-regular fa-copy"></i> نسخ
                </button>
            </div>
            <div class="flex gap-1.5 overflow-x-auto pt-1 text-xs">
                <button onclick="insertSpace()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 px-3 py-1.5 rounded-lg text-gray-300">مسافة</button>
                <button onclick="backspaceBuilder()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 px-3 py-1.5 rounded-lg text-amber-400">حذف حرف</button>
                <button onclick="clearBuilder()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 px-3 py-1.5 rounded-lg text-rose-400">مسح الكل</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل بين الصفحات السريع -->
    <div class="max-w-4xl mx-auto px-3 mt-3">
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs font-bold">
            <a href="index.html" class="bg-slate-900 hover:bg-slate-800 text-gray-300 px-4 py-2 rounded-xl border border-slate-800 shrink-0">الرئيسية والألوان</a>
            <a href="numbers.html" class="bg-slate-900 hover:bg-slate-800 text-gray-300 px-4 py-2 rounded-xl border border-slate-800 shrink-0">الأرقام المزخرفة</a>
            <a href="symbols.html" class="bg-indigo-600 text-white px-4 py-2 rounded-xl border border-indigo-500 shrink-0">الرموز النادرة والشاملة</a>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-3 mt-4">
        <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-md">
            <h2 class="text-sm font-bold text-indigo-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-shapes"></i> موسوعة الرموز والأشكال الهندسية النادرة
            </h2>
            <div id="symbols-grid" class="grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 gap-1.5 p-1">
                <!-- يُولد برمجياً -->
            </div>
        </section>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">تم النسخ بنجاح! 📋</div>

    <script>
        function generateSymbols() {
            let list = [];
            for (let i = 0x25A0; i <= 0x27BF; i++) { list.push(String.fromCharCode(i)); }
            
            const grid = document.getElementById('symbols-grid');
            grid.innerHTML = list.map(s => `
                <button onclick="addToBuilder('${escapeSymbol(s)}')" 
                    class="symbol-btn bg-slate-950 hover:bg-indigo-950 border border-slate-800 hover:border-indigo-500 text-emerald-300 font-bold p-2.5 rounded-xl text-lg flex items-center justify-center min-h-[44px]">
                    ${s}
                </button>
            `).join('');
        }

        function escapeSymbol(sym) { return sym.replace(/'/g, "\\'"); }
        window.onload = generateSymbols;

        function addToBuilder(text) {
            const input = document.getElementById('builder-input');
            input.value += text;
            updateCharCount();
            showToast(`تمت الإضافة`);
        }
        function insertSpace() { addToBuilder(' '); }
        function backspaceBuilder() {
            const input = document.getElementById('builder-input');
            let chars = Array.from(input.value);
            chars.pop();
            input.value = chars.join('');
            updateCharCount();
        }
        function clearBuilder() { document.getElementById('builder-input').value = ''; updateCharCount(); }
        function updateCharCount() { document.getElementById('char-count').innerText = `${Array.from(document.getElementById('builder-input').value).length} حرف`; }
        function copyBuilderText() {
            const val = document.getElementById('builder-input').value;
            if(!val) return;
            navigator.clipboard.writeText(val);
            showToast('تم النسخ بنجاح! 📋');
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 1500);
        }
    </script>
</body>
</html>
